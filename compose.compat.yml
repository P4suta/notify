services:
  ntfy-v227:
    image: binwiederhier/ntfy:v2.27.0
    command: serve
    environment:
      NTFY_BASE_URL: http://127.0.0.1:18080
      NTFY_LISTEN_HTTP: :80
      NTFY_AUTH_DEFAULT_ACCESS: read-write
    ports:
      - "18080:80"

  notify-setup:
    build: .
    command:
      - run
      - setup
      - --listen-host
      - 0.0.0.0
      - --base-url
      - http://127.0.0.1:18081
      - --database
      - /data/notify.db
      - --username
      - admin
      - --password
      - compat-only-password
      - --anonymous-access
      - read-write
    volumes:
      - notify-compat-data:/data

  notify:
    build: .
    command:
      - run
      - serve
      - --listen-host
      - 0.0.0.0
      - --base-url
      - http://127.0.0.1:18081
      - --database
      - /data/notify.db
    depends_on:
      notify-setup:
        condition: service_completed_successfully
    ports:
      - "18081:8080"
    volumes:
      - notify-compat-data:/data

volumes:
  notify-compat-data:
