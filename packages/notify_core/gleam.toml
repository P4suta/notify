name = "notify_core"
version = "0.1.0"
description = "Target-neutral domain types and ntfy wire codecs for Notify"
licences = ["Apache-2.0"]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"

[dev-dependencies]
birdie = ">= 1.5.4 and < 2.0.0"
gleeunit = ">= 1.9.0 and < 2.0.0"
gleam_mutants = { git = "https://github.com:443/P4suta/gleam-mutants.git", ref = "21f2798f5b7eaebe6cdbb2067f38e35dac2b6b1d" }
qcheck = ">= 1.0.4 and < 2.0.0"

[tools.gleam_mutants]
version = 1

[tools.gleam_mutants.mutation]
include = ["src/**/*.gleam"]
exclude = ["test/**", "build/**", "reports/**"]

[tools.gleam_mutants.test]
target = "auto"
baseline_runs = 1
command = ["gleam", "test"]

[tools.gleam_mutants.execution]
jobs = 4

[tools.gleam_mutants.cache]
mode = "auto"

[tools.gleam_mutants.policy]
strict = true
minimum_score = 100
require_mutants = true

[tools.gleam_mutants.report]
directory = "reports/mutation"
formats = ["json", "html"]
history = false
diagnostics = "errors"
high = 90
low = 80

[tools.glinter]
stats = true
warnings_as_errors = true
include = ["src/"]

[tools.glinter.rules]
avoid_panic = "error"
avoid_todo = "error"
division_by_zero = "error"
echo = "warning"
duplicate_import = "warning"
unnecessary_variable = "warning"
redundant_case = "warning"
unnecessary_string_concatenation = "warning"
trailing_underscore = "warning"
assert_ok_pattern = "off"
error_context_lost = "off"
thrown_away_error = "off"
stringly_typed_error = "off"
discarded_result = "off"
unwrap_used = "off"
panic_without_message = "off"
todo_without_message = "off"
string_inspect = "off"
short_variable_name = "off"
prefer_guard_clause = "off"
missing_type_annotation = "off"
deep_nesting = "off"
function_complexity = "off"
module_complexity = "off"
label_possible = "off"
missing_labels = "off"
unqualified_import = "off"
unused_exports = "off"
ffi_usage = "off"
