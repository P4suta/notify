---
name: Native packaging

on:
  push:
    branches:
      - main
  schedule:
    - cron: "19 19 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.20.3"
  GLEAM_VERSION: "1.18.1"
  OTP_VERSION: "28.4.3"
  ZIG_VERSION: "0.15.2"

jobs:
  posix:
    name: Native ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_amd64
            binary: burrito_out/notify_linux_amd64
          - runner: ubuntu-24.04-arm
            target: linux_arm64
            binary: burrito_out/notify_linux_arm64
          - runner: macos-15-intel
            target: macos_amd64
            binary: burrito_out/notify_macos_amd64
          - runner: macos-15
            target: macos_arm64
            binary: burrito_out/notify_macos_arm64
    env:
      NATIVE_BINARY: ${{ matrix.binary }}
      NATIVE_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install BEAM and Gleam toolchains
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: "3"
      - name: Install checksum-verified Zig
        run: packaging/native/install_zig.sh "$ZIG_VERSION"
      - name: Install exact MixGleam archive
        run: mix archive.install hex mix_gleam 0.6.2 --force
      - name: Build locked host-native executable
        run: packaging/native/build.sh "$NATIVE_TARGET"
      - name: Smoke-test native lifecycle
        run: test/native_smoke.sh "$NATIVE_BINARY"

  windows:
    name: Native windows_amd64
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install BEAM and Gleam toolchains
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: "3"
      - name: Install checksum-verified Zig
        shell: pwsh
        run: |
          try {
              & ./packaging/native/install_zig.ps1 -Version 0.15.3
              throw "unsupported Zig version was accepted"
          }
          catch {
              if ($_.Exception.Message -ne "unsupported Zig version: 0.15.3") {
                  throw
              }
          }
          & ./packaging/native/install_zig.ps1 -Version $env:ZIG_VERSION
      - name: Enable pre-installed MSYS2 build tools
        shell: pwsh
        run: |
          $toolPaths = @("C:\msys64\mingw64\bin", "C:\msys64\usr\bin")
          foreach ($toolPath in $toolPaths) {
              if (-not (Test-Path -LiteralPath $toolPath -PathType Container)) {
                  throw "required MSYS2 tool directory is missing: $toolPath"
              }
              Add-Content -LiteralPath $env:GITHUB_PATH -Value $toolPath -Encoding utf8
          }
          $env:PATH = ($toolPaths -join [IO.Path]::PathSeparator) +
              [IO.Path]::PathSeparator + $env:PATH
          foreach ($command in @("make", "gcc", "xz", "7z")) {
              Get-Command $command -ErrorAction Stop | Out-Null
          }
      - name: Install exact MixGleam archive
        run: mix archive.install hex mix_gleam 0.6.2 --force
      - name: Build locked host-native executable
        shell: pwsh
        run: ./packaging/native/build.ps1 -Target windows_amd64
      - name: Smoke-test Windows recovery
        shell: pwsh
        run: ./test/native_smoke.ps1 -Artifact burrito_out/notify_windows_amd64.exe
