---
name: Supply-chain security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "47 20 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Vulnerability, license, and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Test locked inventory and license policy
        run: |
          python3 test/supply_chain_inventory_test.py
          python3 test/refresh_locked_licenses_test.py
          python3 test/check_licenses_test.py
          python3 test/check_licenses.py --root .
      - name: Build runtime image
        run: docker build --tag notify:security .
      - name: Scan source and runtime image
        run: test/vulnerability_scan.sh notify:security
      - name: Generate and validate CycloneDX SBOMs
        env:
          SBOM_DIRECTORY: ${{ runner.temp }}/notify-sbom
        run: test/generate_sbom.sh notify:security "$SBOM_DIRECTORY"
      - name: Upload private workflow SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notify-sbom-${{ github.run_id }}
          path: ${{ runner.temp }}/notify-sbom/*.json
          if-no-files-found: error
          retention-days: 3
