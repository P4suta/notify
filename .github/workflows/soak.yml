---
name: Target cluster soak

on:
  schedule:
    - cron: "23 19 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluster-soak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    name: ${{ matrix.backend }} · ${{ matrix.format }} · 10k at 500 publish/s
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        backend: [postgres, sqlite]
        format: [json, raw, sse, websocket]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise the backend target
        env:
          NOTIFY_SOAK_FORMAT: ${{ matrix.format }}
          NOTIFY_SOAK_PROJECT_NAME: notify-soak-${{ matrix.backend }}-${{ matrix.format }}-${{ github.run_id }}-${{ github.run_attempt }}
          NOTIFY_SOAK_REPORT_DIRECTORY: ${{ runner.temp }}/notify-soak-${{ matrix.backend }}-${{ matrix.format }}
        run: |
          if [[ '${{ matrix.backend }}' == postgres ]]; then
            test/cluster_soak.sh
          else
            test/sqlite_soak.sh
          fi
      - name: Upload private soak evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-soak-${{ matrix.backend }}-${{ matrix.format }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/notify-soak-${{ matrix.backend }}-${{ matrix.format }}
          if-no-files-found: warn
          retention-days: 7
