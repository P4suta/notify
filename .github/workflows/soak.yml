---
name: Target cluster soak

on:
  schedule:
    - cron: "23 19 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluster-soak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    name: 10k subscriptions at 500 publish/s
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise the three-node target
        env:
          NOTIFY_SOAK_PROJECT_NAME: notify-soak-${{ github.run_id }}-${{ github.run_attempt }}
          NOTIFY_SOAK_REPORT_DIRECTORY: ${{ runner.temp }}/notify-soak
        run: test/cluster_soak.sh
      - name: Upload private soak evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cluster-soak-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/notify-soak
          if-no-files-found: warn
          retention-days: 7
