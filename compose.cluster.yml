---
x-notify: &notify
  build: .
  depends_on:
    postgres:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
  environment: &notify-environment
    NOTIFY_BIND: 0.0.0.0
    NOTIFY_BASE_URL: http://localhost:8080
    NOTIFY_DATABASE_BACKEND: postgres
    NOTIFY_POSTGRES_HOST: postgres
    NOTIFY_POSTGRES_DATABASE: notify
    NOTIFY_POSTGRES_USERNAME: notify
    NOTIFY_POSTGRES_PASSWORD: notify-development-password
    NOTIFY_CLUSTER_ENABLED: "true"
    NOTIFY_ATTACHMENT_BACKEND: s3
    NOTIFY_S3_ENDPOINT: http://minio:9000
    NOTIFY_S3_BUCKET: notify
    NOTIFY_S3_REGION: us-east-1
    NOTIFY_S3_ACCESS_KEY: notify-minio
    NOTIFY_S3_SECRET_KEY: notify-minio-development-password
    NOTIFY_S3_PATH_STYLE: "true"
  restart: unless-stopped

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: notify
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify-development-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notify"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: notify-minio
      MINIO_ROOT_PASSWORD: notify-minio-development-password
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 notify-minio notify-minio-development-password; do sleep 1; done;
        mc mb --ignore-existing local/notify

  notify-a:
    <<: *notify
    environment:
      <<: *notify-environment
      NOTIFY_NODE_ID: notify-a
    ports:
      - "8080:8080"

  notify-b:
    <<: *notify
    environment:
      <<: *notify-environment
      NOTIFY_NODE_ID: notify-b
    ports:
      - "8081:8080"

volumes:
  postgres-data:
  minio-data:
