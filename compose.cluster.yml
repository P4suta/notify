---
x-notify: &notify
  build: .
  image: ${NOTIFY_CLUSTER_IMAGE:-notify:cluster-local}
  depends_on:
    postgres:
      condition: service_healthy
    s3:
      condition: service_healthy
  environment: &notify-environment
    NOTIFY_BIND: 0.0.0.0
    NOTIFY_BASE_URL: http://localhost:8080
    NOTIFY_DATABASE_BACKEND: postgres
    NOTIFY_POSTGRES_HOST: postgres
    NOTIFY_POSTGRES_DATABASE: notify
    NOTIFY_POSTGRES_USERNAME: notify
    NOTIFY_POSTGRES_PASSWORD: notify-development-password
    NOTIFY_CLUSTER_ENABLED: "true"
    NOTIFY_RATE_LIMIT_REQUESTS: "${NOTIFY_CLUSTER_RATE_LIMIT_REQUESTS:-120}"
    NOTIFY_RATE_LIMIT_SUBSCRIPTIONS: "${NOTIFY_CLUSTER_RATE_LIMIT_SUBSCRIPTIONS:-30}"
    NOTIFY_RATE_LIMIT_TOPIC_CREATIONS: "${NOTIFY_CLUSTER_RATE_LIMIT_TOPIC_CREATIONS:-60}"
    NOTIFY_RATE_LIMIT_WINDOW_SECONDS: "${NOTIFY_CLUSTER_RATE_LIMIT_WINDOW_SECONDS:-60}"
    NOTIFY_ATTACHMENT_BACKEND: s3
    NOTIFY_S3_ENDPOINT: http://s3:9000
    NOTIFY_S3_BUCKET: notify
    NOTIFY_S3_REGION: us-east-1
    NOTIFY_S3_ACCESS_KEY: notify-s3
    NOTIFY_S3_SECRET_KEY: notify-s3-development-password
    NOTIFY_S3_PATH_STYLE: "true"
    NOTIFY_RELAY_URL: "${NOTIFY_CLUSTER_RELAY_URL:-}"
    NOTIFY_RELAY_TOKEN: "${NOTIFY_CLUSTER_RELAY_TOKEN:-}"
  restart: unless-stopped
  ulimits:
    nofile:
      soft: 65536
      hard: 65536

services:
  postgres:
    image: postgres:17.11-alpine3.24
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - pg_stat_statements.track=all
    environment:
      POSTGRES_DB: notify
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify-development-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notify"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    # renovate: datasource=docker depName=versity/versitygw
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    command:
      - --port
      - :9000
      - --region
      - us-east-1
      - --health
      - /health
      - posix
      - /data
    depends_on:
      s3-init:
        condition: service_completed_successfully
    environment:
      ROOT_ACCESS_KEY_ID: notify-s3
      ROOT_SECRET_ACCESS_KEY: notify-s3-development-password
    volumes:
      - s3-data:/data
    ports:
      - "127.0.0.1:19000:9000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  s3-init:
    # Keep this image identical to the gateway so one verified artifact provides both the shell and the server.
    # renovate: datasource=docker depName=versity/versitygw
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /data/notify"]
    volumes:
      - s3-data:/data

  relay-mock:
    image: ${NOTIFY_CLUSTER_IMAGE:-notify:cluster-local}
    entrypoint: ["escript", "/test/relay_fault_server.escript"]
    command: []
    volumes:
      - ./test/relay_fault_server.escript:/test/relay_fault_server.escript:ro

  relay-benchmark:
    image: ${NOTIFY_CLUSTER_IMAGE:-notify:cluster-local}
    entrypoint: ["escript", "/test/relay_benchmark_server.escript"]
    command: []
    environment:
      NOTIFY_RELAY_DELAY_MS: "${NOTIFY_RELAY_DELAY_MS:-0}"
    volumes:
      - ./test/relay_benchmark_server.escript:/test/relay_benchmark_server.escript:ro

  notify-a:
    <<: *notify
    environment:
      <<: *notify-environment
      NOTIFY_NODE_ID: notify-a
    ports:
      - "8080:8080/tcp"
      - "8080:8080/udp"

  notify-b:
    <<: *notify
    environment:
      <<: *notify-environment
      NOTIFY_NODE_ID: notify-b
    ports:
      - "8081:8080/tcp"
      - "8081:8080/udp"

  notify-c:
    <<: *notify
    environment:
      <<: *notify-environment
      NOTIFY_NODE_ID: notify-c
    ports:
      - "8082:8080/tcp"
      - "8082:8080/udp"

volumes:
  postgres-data:
  s3-data:
